# MICUBE Continue 하이브리드 빌드 파이프라인

variables:
  NODE_VERSION: "20.12.2"
  GIT_SUBMODULE_STRATEGY: recursive
  npm_config_msvs_version: "2022"

stages:
  - prep
  - core
  - gui
  - binary
  - extensions

# --- 공통 설정 ---

default:
  interruptible: true

.linux_job:
  image: node:20-bookworm-slim
  tags:
    - linux-runner-luna

.windows_job:
  image: node:20.12.2-windowsservercore-ltsc2022
  tags:
    - windows-runner-luna

# --- 빌드 단계 정의 ---

# 1. 패키지 설치 (Linux에서 고속 실행)
build:packages:
  extends: .linux_job
  stage: prep
  script:
    - npm ci
    - node ./scripts/build-packages.js
  artifacts:
    paths:
      - "packages/*/node_modules/"
      - "node_modules/"
    expire_in: 1 hour

# 2. 코어 빌드 (Windows 네이티브 모듈 컴파일)
build:core:
  extends: .windows_job
  stage: core
  needs:
    - build:packages
  script:
    - cd core
    - npm ci
    - npm run build
  artifacts:
    paths:
      - "core/dist/"
      - "core/node_modules/"
      - "core/build/"
    expire_in: 1 hour

# 3. GUI 빌드 (Linux에서 실행)
build:gui:
  extends: .linux_job
  stage: gui
  needs:
    - build:packages
  script:
    - cd gui
    - npm ci
    - npm run build
  artifacts:
    paths:
      - "gui/dist/"
    expire_in: 1 hour

# 4. 네이티브 바이너리 빌드 (Windows 전용)
build:binary:windows:
  extends: .windows_job
  stage: binary
  needs:
    - build:core
  script:
    - cd binary
    - npm ci
    - npm run build
  artifacts:
    paths:
      - "binary/bin/"
    expire_in: 1 hour

# 5. VS Code 확장 프로그램 패키징 (Windows용 바이너리 포함을 위해 Windows에서 수행)
build:vscode:windows:
  extends: .windows_job
  stage: extensions
  needs:
    - build:core
    - build:gui
    - build:binary:windows
  script:
    - cd extensions/vscode
    - npm ci
    - npm run package
  artifacts:
    paths:
      - "extensions/vscode/build/*.vsix"
    expire_in: 1 week

# 6. IntelliJ 확장 프로그램 빌드 (Linux Gradle 활용)
build:intellij:linux:
  extends: .linux_job
  image: gradle:8.7-jdk17
  stage: extensions
  needs:
    - build:gui
  script:
    - cd extensions/intellij
    - chmod +x ./gradlew
    - ./gradlew buildPlugin
  artifacts:
    paths:
      - "extensions/intellij/build/distributions/*.zip"
    expire_in: 1 week

# --- [제한] 불필요한 파이프라인 방지 ---
workflow:
  rules:
    - if: $CI_PROJECT_NAME == "ax-continue"
      when: always
    - if: $CI_PROJECT_NAME == "micube-continue"
      when: always
