# MICUBE Continue 하이브리드 빌드 파이프라인

variables:
  NODE_VERSION: "20.12.2"
  GIT_SUBMODULE_STRATEGY: recursive
  npm_config_msvs_version: "2022"

stages:
  - core
  - gui
  - binary
  - extensions

# --- 공통 설정 ---

default:
  interruptible: true

.linux_job:
  image: node:20-bookworm-slim
  tags:
    - linux-runner-luna

.windows_job:
  image: npm-windows:20.12
  tags:
    - windows-runner-luna
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"

.mac_job:
  tags:
    - mac-runner

# --- OS별 독립 종속성 설정 템플릿 ---

.setup_linux:
  extends: .linux_job
  before_script:
    - npm install
    - node ./scripts/build-packages.js

.setup_windows:
  extends: .windows_job
  before_script:
    - npm install
    - node ./scripts/build-packages.js

.setup_mac:
  # extends: .mac_job
  # Mac Runner 준비 시 위 주석 해제 후 사용
  before_script:
    - npm install
    - node ./scripts/build-packages.js

# --- 빌드 단계 정의 ---

# 1. 코어 빌드 (Windows 네이티브 모듈 컴파일 대신 검증만 수행)
build:core:
  extends: .setup_windows
  stage: core
  script:
    - cd core
    - npm install
    - npx tsc --noEmit

# 2. GUI 빌드 (Linux에서 실행)
build:gui:
  extends: .setup_linux
  stage: gui
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  script:
    - cd core
    - npm install
    - cd ../gui
    - npm install
    - npm run build
  artifacts:
    paths:
      - "gui/dist/"
    expire_in: 1 hour

# 3. 네이티브 바이너리 빌드 (Windows 전용)
build:binary:windows:
  extends: .setup_windows
  stage: binary
  needs:
    - build:core
  script:
    - cd binary
    - npm install
    - npm run build
  artifacts:
    paths:
      - "binary/bin/"
    expire_in: 1 hour

# 4. VS Code 확장 프로그램 패키징 (Windows용 바이너리 포함을 위해 Windows에서 수행)
build:vscode:windows:
  extends: .setup_windows
  stage: extensions
  needs:
    - build:gui
    - build:binary:windows
  script:
    - cd core
    - npm install
    - cd ../extensions/vscode
    - npm install
    - npm run package
  artifacts:
    paths:
      - "extensions/vscode/build/*.vsix"
    expire_in: 1 week

# 5. IntelliJ 확장 프로그램 빌드 (Linux Gradle 활용)
build:intellij:linux:
  extends: .linux_job
  image: gradle:8.7-jdk17
  stage: extensions
  needs:
    - build:gui
  script:
    - cd extensions/intellij
    - chmod +x ./gradlew
    - ./gradlew buildPlugin
  artifacts:
    paths:
      - "extensions/intellij/build/distributions/*.zip"
    expire_in: 1 week

# --- [제한] 상위 프로젝트(AX Continue)에서만 실행되도록 제한 ---
workflow:
  rules:
    # 실행 경로가 상위 프로젝트인 경우에만 파이프라인 생성
    - if: $CI_PROJECT_PATH == "ax-poc/aidd/ax-continue"
      when: always
    # 그 외(하위 프로젝트 단독 푸시 등)의 경우는 파이프라인을 생성하지 않음
    - when: never
